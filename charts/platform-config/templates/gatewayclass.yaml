# templates/gatewayclass.yaml: "gateways of class envoy are run by Envoy Gateway, configured by edge-proxy"
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: edge-proxy
    namespace: {{ .Release.Namespace }}
